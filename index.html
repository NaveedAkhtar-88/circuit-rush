<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Circuit Rush</title>
<meta name="description" content="Real-time multiplayer racing for up to 8 players with nitro, EMP shocks, bots and a three race championship.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{--bg:#0a1822;--surface:#10252f;--surface-2:#14303c;--line:#234552;--fg:#e5f0f1;--muted:#9bb3b8;--accent:#2ec4b6;--ink:#062a27;--spark:#ff7a3d;--bad:#ff7b72;--ok:#3fb950;--font-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;--font-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--font-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
a{color:var(--accent);text-underline-offset:3px}
button,input{font:inherit}
button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.bar{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:14px;border-bottom:1px solid var(--line)}
.brand{font-family:var(--font-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:14px;color:var(--fg);text-decoration:none}
.game{font-family:var(--font-mono);font-size:13px;color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 8px;display:grid;gap:16px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(30px,6vw,44px);line-height:1.1;margin:0;text-wrap:balance}
h2{font-family:var(--font-display);font-weight:600;font-size:19px;margin:0 0 10px}
.lede{color:var(--muted);margin:-6px 0 0;max-width:60ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;min-width:0}
.center{text-align:center}
label{display:block;font-family:var(--font-mono);font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin:0 0 6px}
input[type=text]{width:100%;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:11px 12px;min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:14px;margin-top:14px;align-items:end}
.join{display:flex;gap:8px;min-width:0}.join input{text-transform:uppercase;letter-spacing:.2em;font-family:var(--font-mono);text-align:center}
.btn{font-family:var(--font-mono);font-size:14px;font-weight:500;padding:11px 18px;border-radius:8px;border:1px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;min-height:44px}
.btn.primary{background:var(--accent);color:var(--ink)}
.btn.wide{width:100%;margin-top:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:not(:disabled):hover{filter:brightness(1.12)}
.link{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:8px}
.err{color:var(--bad);font-family:var(--font-mono);font-size:14px;margin:12px 0 0;min-height:1.3em}
.busy{color:var(--accent);font-family:var(--font-mono);font-size:14px;margin:12px 0 0}
.muted{color:var(--muted);font-size:14px;margin:8px 0 0}
.rules{margin:0;padding-left:20px;display:grid;gap:6px}
.rules li::marker{color:var(--accent);font-family:var(--font-mono)}
.code{font-family:var(--font-display);font-weight:700;font-size:clamp(48px,14vw,84px);letter-spacing:.18em;line-height:1.1;margin:4px 0 12px;color:var(--accent);padding-left:.18em}
.board,.res{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.board li,.res li{display:grid;grid-template-columns:28px minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.board li.me,.res li.me{border-color:var(--accent)}
.board li.off{opacity:.5}
.rk{font-family:var(--font-mono);color:var(--muted)}
.nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc,.pt{font-family:var(--font-mono);font-weight:500;color:var(--accent)}
.st{font-family:var(--font-mono);font-size:12px;color:var(--muted)}
.res li{grid-template-columns:minmax(0,1fr) auto auto}
.res .an{font-family:var(--font-mono);font-size:13px;color:var(--muted)}
.hud{display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:14px}
.hud .tm{color:var(--spark);font-weight:500}
.tbar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;margin-top:-6px}
.tbar i{display:block;height:100%;background:var(--accent);transition:width .25s linear}
.q{font-size:clamp(18px,3.4vw,22px);font-weight:500;margin:0 0 14px;line-height:1.35;overflow-wrap:anywhere}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt,.resp,.rres{display:flex;gap:12px;align-items:flex-start;text-align:left;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:14px;cursor:pointer;min-width:0}
.opt{align-items:center}
.opt b{font-family:var(--font-mono);color:var(--accent);flex:none}
.opt span{overflow-wrap:anywhere}
.opt:not(:disabled):hover,.resp:not(:disabled):hover,.rres:not(:disabled):hover{border-color:var(--accent)}
.opt:disabled,.resp:disabled,.rres:disabled{cursor:default}
.good{border-color:var(--ok)!important;background:rgba(63,185,80,.14)}
.bad{border-color:var(--bad)!important;background:rgba(255,123,114,.12)}
.picked{border-color:var(--accent)}
.duel{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.resp{flex-direction:column;gap:8px}
.resp b{font-family:var(--font-mono);font-size:13px;color:var(--accent)}
.pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:15px}
.ranklist{display:grid;gap:10px;margin-bottom:14px}
.rres{align-items:flex-start;width:100%}
.rres .pos{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-family:var(--font-mono);color:var(--accent)}
.rres.picked .pos{background:var(--accent);color:var(--ink);border-color:var(--accent)}
.rres .body{display:grid;gap:2px;min-width:0;flex:1}
.rres .body span{color:var(--muted);font-size:14px}
.rate{flex:none;font-family:var(--font-mono);font-size:12px;padding:3px 8px;border-radius:99px;border:1px solid var(--line);white-space:nowrap}
.r4,.r3{color:var(--ok);border-color:var(--ok)}.r2{color:var(--accent);border-color:var(--accent)}.r1{color:var(--spark);border-color:var(--spark)}.r0{color:var(--bad);border-color:var(--bad)}
.why{margin:14px 0 0;padding:12px 14px;border-left:3px solid var(--spark);background:var(--surface-2);border-radius:0 8px 8px 0;font-size:15px}
.status{text-align:center;color:var(--muted);font-family:var(--font-mono);font-size:14px;margin:0}
.trophy{font-family:var(--font-display);font-weight:700;font-size:clamp(26px,6vw,38px);color:var(--accent)}
.mono{font-family:var(--font-mono)}
.foot{max-width:760px;margin:24px auto 0;padding-block:16px 28px;border-top:1px solid var(--line);color:var(--muted);font-size:13px}
@media (max-width:640px){.split{grid-template-columns:minmax(0,1fr)}.opts,.duel{grid-template-columns:minmax(0,1fr)}.board li{grid-template-columns:24px minmax(0,1fr) auto auto}}
@media (prefers-reduced-motion:reduce){.tbar i{transition:none}}

.row{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%}
#cv{position:fixed;inset:0;width:100%;height:100%;display:none;background:#08141b;touch-action:none}
body.racing{overflow:hidden;padding:0}
body.racing #cv{display:block}
body.racing #app{display:none}
#touch{display:none}
body.racing.touch #touch{display:block}
#touch button{position:fixed;bottom:max(18px,env(safe-area-inset-bottom,0px));width:76px;height:76px;border-radius:50%;border:2px solid var(--accent);background:rgba(8,20,27,.6);color:var(--fg);font-family:var(--font-mono);font-size:13px;font-weight:600;touch-action:none;user-select:none;-webkit-user-select:none}
#tl{left:max(16px,env(safe-area-inset-left,0px))}#tr{left:calc(max(16px,env(safe-area-inset-left,0px)) + 92px)}
#tn{right:max(16px,env(safe-area-inset-right,0px));border-color:var(--spark)!important;color:var(--spark)!important}
#te{right:calc(max(16px,env(safe-area-inset-right,0px)) + 92px);border-color:#bb6bd9!important;color:#bb6bd9!important}
#tb{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(max(18px,env(safe-area-inset-bottom,0px)) + 90px)!important;width:56px!important;height:56px!important}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="cv"></canvas>
<div id="touch"><button id="tl">LEFT</button><button id="tr">RIGHT</button><button id="tb">BRK</button><button id="tn">NITRO</button><button id="te">EMP</button></div>
<noscript>This game needs JavaScript.</noscript>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function () {
'use strict';
var PFX = 'nakt-rush-', ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', MAX = 8;
var Q = new URLSearchParams(location.search);
var LAPS = Math.max(1, Math.min(5, parseInt(Q.get('laps'), 10) || 3));
var TOTAL = 3, PTS = [10, 8, 6, 5, 4, 3, 2, 1];
var COLORS = ['#2ec4b6', '#ff7a3d', '#f2c94c', '#bb6bd9', '#56ccf2', '#eb5757', '#6fcf97', '#f2994a'];
var BOTN = ['Turbo', 'Nitro', 'Drift', 'Apex', 'Slick', 'Vortex', 'Blitz'];
var W = 78, BAR = 46, SP = 12, BASE = 470, NIT = 720;
var TRACKS = [
  { name: 'Neon Loop', seed: 11, n: 8, R: 1000, ex: 1.35, ey: 0.9 },
  { name: 'Twist Canyon', seed: 5, n: 11, R: 1150, ex: 1.1, ey: 1.0 },
  { name: 'Hairpin Highway', seed: 3, n: 7, R: 1150, ex: 1.5, ey: 0.85 }
];
var $ = function (i) { return document.getElementById(i); };
function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function angd(a) { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; }
function rng(seed) { var s = seed >>> 0; return function () { s = (s + 0x6D2B79F5) >>> 0; var t = s; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }

/* ---------------- track ---------------- */
function genTrack(def, seed) {
  var r = rng(seed), n = def.n, c = [], i, k;
  for (i = 0; i < n; i++) { var a = i / n * Math.PI * 2, rad = def.R * (0.58 + 0.42 * r()); c.push([Math.cos(a) * rad * def.ex, Math.sin(a) * rad * def.ey]); }
  var dense = [], per = 30;
  for (i = 0; i < n; i++) {
    var p0 = c[(i + n - 1) % n], p1 = c[i], p2 = c[(i + 1) % n], p3 = c[(i + 2) % n];
    for (k = 0; k < per; k++) {
      var t = k / per, t2 = t * t, t3 = t2 * t, pt = [];
      for (var d = 0; d < 2; d++) pt.push(0.5 * ((2 * p1[d]) + (-p0[d] + p2[d]) * t + (2 * p0[d] - 5 * p1[d] + 4 * p2[d] - p3[d]) * t2 + (-p0[d] + 3 * p1[d] - 3 * p2[d] + p3[d]) * t3));
      dense.push(pt);
    }
  }
  var m = dense.length, cum = [0];
  for (i = 1; i <= m; i++) { var a0 = dense[i - 1], b0 = dense[i % m]; cum.push(cum[i - 1] + Math.hypot(b0[0] - a0[0], b0[1] - a0[1])); }
  var L = cum[m], N = Math.round(L / SP), sp = L / N, P = [], j = 0;
  for (i = 0; i < N; i++) {
    var dd = i * sp; while (cum[j + 1] < dd) j++;
    var f = (dd - cum[j]) / (cum[j + 1] - cum[j]), A = dense[j], B = dense[(j + 1) % m];
    P.push([A[0] + (B[0] - A[0]) * f, A[1] + (B[1] - A[1]) * f]);
  }
  var T = [], Nn = [];
  for (i = 0; i < N; i++) {
    var q1 = P[(i + N - 2) % N], q2 = P[(i + 2) % N], dx = q2[0] - q1[0], dy = q2[1] - q1[1], l = Math.hypot(dx, dy);
    T.push([dx / l, dy / l]); Nn.push([-dy / l, dx / l]);
  }
  var ok = true, i2;
  for (i = 0; i < N && ok; i += 3) {
    var cur = Math.acos(clamp(T[i][0] * T[(i + 3) % N][0] + T[i][1] * T[(i + 3) % N][1], -1, 1));
    if (cur > 0.36) ok = false;
    for (i2 = i + 70; i2 < N && ok; i2 += 3) {
      if (N - (i2 - i) < 70) break;
      if (Math.hypot(P[i][0] - P[i2][0], P[i][1] - P[i2][1]) < 2 * (W + BAR) + 40) ok = false;
    }
  }
  return { P: P, T: T, Nn: Nn, N: N, L: L, sp: sp, ok: ok, def: def, seed: seed };
}
var trackCache = {};
function getTrack(ix) {
  if (trackCache[ix]) return trackCache[ix];
  var def = TRACKS[ix], tr = null;
  for (var k = 0; k < 80; k++) { tr = genTrack(def, def.seed + k * 101); if (tr.ok) break; }
  var P = tr.P, i, minx = 1e9, maxx = -1e9, miny = 1e9, maxy = -1e9;
  for (i = 0; i < tr.N; i++) { minx = Math.min(minx, P[i][0]); maxx = Math.max(maxx, P[i][0]); miny = Math.min(miny, P[i][1]); maxy = Math.max(maxy, P[i][1]); }
  tr.bb = [minx, miny, maxx, maxy];
  var path = new Path2D(); path.moveTo(P[0][0], P[0][1]);
  for (i = 1; i < tr.N; i++) path.lineTo(P[i][0], P[i][1]);
  path.closePath(); tr.path = path;
  var r = rng(tr.seed + 77); tr.items = [];
  for (i = 0; i < 9; i++) {
    var idx = Math.floor((i + 0.5) / 9 * tr.N + 6 * (r() - 0.5)), kind = i % 3 === 2 ? 'box' : 'orb', off = (r() - 0.5) * (W * 1.0);
    tr.items.push({ idx: (idx + tr.N) % tr.N, off: off, kind: kind, x: P[(idx + tr.N) % tr.N][0] + tr.Nn[(idx + tr.N) % tr.N][0] * off, y: P[(idx + tr.N) % tr.N][1] + tr.Nn[(idx + tr.N) % tr.N][1] * off });
  }
  trackCache[ix] = tr; return tr;
}

/* ---------------- car physics ---------------- */
function newCar(tr, slot) {
  var row = slot >> 1, side = (slot & 1) ? 1 : -1, idx = (tr.N - 4 - row * 4 + tr.N) % tr.N;
  var nn = tr.Nn[idx], pp = tr.P[idx], t = tr.T[idx];
  return { x: pp[0] + nn[0] * side * 30, y: pp[1] + nn[1] * side * 30, a: Math.atan2(t[1], t[0]), vx: 0, vy: 0, nitro: 60, nitOn: false, boost: 0, slow: 0, idx: idx, s: idx * tr.sp - tr.L, prog: -(4 + row * 4) * tr.sp, dist: 0, off: false, hit: 0, lane: (Math.random() - 0.5) * 50, skill: 0.9 + Math.random() * 0.08 };
}
function locate(c, tr) {
  var N = tr.N, P = tr.P, best = 1e18, bi = c.idx, i, k;
  for (k = -22; k <= 22; k++) { i = (c.idx + k + N) % N; var dx = c.x - P[i][0], dy = c.y - P[i][1], d = dx * dx + dy * dy; if (d < best) { best = d; bi = i; } }
  c.idx = bi; var dist = Math.sqrt(best); c.dist = dist; c.off = dist > W;
  if (dist > W + BAR) {
    var nx = (c.x - P[bi][0]) / dist, ny = (c.y - P[bi][1]) / dist;
    c.x = P[bi][0] + nx * (W + BAR); c.y = P[bi][1] + ny * (W + BAR);
    var vn = c.vx * nx + c.vy * ny;
    if (vn > 0) { c.vx -= vn * nx * 1.35; c.vy -= vn * ny * 1.35; c.hit = 0.2; }
    c.vx *= 0.985; c.vy *= 0.985;
  }
  var s = bi * tr.sp, ds = s - (c.s % tr.L + tr.L) % tr.L;
  if (ds < -tr.L / 2) ds += tr.L; else if (ds > tr.L / 2) ds -= tr.L;
  c.prog += ds; c.s = s;
}
function stepCar(c, inp, dt, tr, cap) {
  var fx = Math.cos(c.a), fy = Math.sin(c.a), vf = c.vx * fx + c.vy * fy;
  var nit = !!(inp.nitro && c.nitro > 1 && inp.gas);
  var sp = Math.min(1, Math.abs(vf) / 200), rate = 2.75 * (1 - 0.42 * Math.min(1, Math.abs(vf) / NIT));
  c.a += inp.steer * (vf >= 0 ? 1 : -1) * rate * sp * dt;
  fx = Math.cos(c.a); fy = Math.sin(c.a);
  var rx = -fy, ry = fx; vf = c.vx * fx + c.vy * fy; var vl = c.vx * rx + c.vy * ry;
  var mv = (nit ? NIT : BASE) * (cap || 1);
  if (c.off) mv *= 0.55;
  if (c.slow > 0) { mv *= 0.4; c.slow -= dt; }
  if (c.boost > 0) { mv = Math.max(mv, NIT * 1.1); c.boost -= dt; }
  if (inp.gas) { var acc = (nit || c.boost > 0) ? 950 : 430; if (vf < mv) vf = Math.min(mv, vf + acc * dt); else vf = Math.max(mv, vf - 520 * dt); }

  c.x += c.vx * dt; c.y += c.vy * dt;

  locate(c, tr);
}
function botInput(b, tr) {
  var look = (b.idx + 17) % tr.N, t = tr.P[look], nn = tr.Nn[look];
  var want = Math.atan2(t[1] + nn[1] * b.lane - b.y, t[0] + nn[0] * b.lane - b.x), diff = angd(want - b.a);
  var vf = b.vx * Math.cos(b.a) + b.vy * Math.sin(b.a);
  return { steer: clamp(diff * 2.6, -1, 1), gas: true, brake: Math.abs(diff) > 0.85 && vf > 280, nitro: b.nitro > 30 && Math.abs(diff) < 0.1 };
}

/* ---------------- network + host state ---------------- */
var mode = '', peer = null, hostConn = null, conns = {}, me = { pid: '', name: '' };
var S = null, V = null, offset = 0, err = '', busy = '', ended = false, joined = false, home = { name: '', code: '' }, copied = false;
var bots = {}, cars = {}, hostTimer = null;
var R = null, curRace = -9, I = { steer: 0, gas: false, brake: false, nitro: false }, touchMode = false, autodrive = false;

function clean(n) { n = String(n || '').replace(/\s+/g, ' ').trim().slice(0, 14); return n || 'Player'; }
function rndCode() { var s = ''; for (var i = 0; i < 4; i++) s += ALPH[Math.floor(Math.random() * ALPH.length)]; return s; }
function uniq(n) { var names = S.order.map(function (p) { return S.players[p].name; }), base = n, k = 2; while (names.indexOf(n) >= 0) n = base + ' ' + k++; return n; }
function nowT() { return Date.now() + offset; }

function initState(code) {
  S = { code: code, phase: 'lobby', players: { host: { name: me.name, pts: 0, online: true, bot: false, col: 0, place: 0, gain: 0, time: 0 } }, order: ['host'], raceNo: -1, trackIdx: 0, startAt: 0, fin: {}, finOrder: [], firstFin: 0, nextAt: 0 };
}
function makeView() {
  return {
    code: S.code, phase: S.phase, raceNo: S.raceNo, total: TOTAL, trackIdx: S.trackIdx, startAt: S.startAt, nextAt: S.nextAt, laps: LAPS,
    players: S.order.map(function (pid, i) { var p = S.players[pid]; return { pid: pid, name: p.name, pts: p.pts, online: p.online, bot: p.bot, col: i % 8, place: p.place, gain: p.gain, time: p.time, fin: !!S.fin[pid], ft: S.fin[pid] ? S.fin[pid].t : 0 }; })
  };
}
function bc() {
  var v = makeView(); setView(v, 0);
  Object.keys(conns).forEach(function (pid) { try { conns[pid].send({ t: 'S', v: v, now: Date.now() }); } catch (e) {} });

  });

function fmt(ms) { var s = Math.max(0, ms) / 1000, m = Math.floor(s / 60); return m + ':' + (s % 60 < 10 ? '0' : '') + (s % 60).toFixed(2); }

}

/* ---------------- main loop ---------------- */
var last = 0, acc = 0, sendAcc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  var dt = Math.min(0.1, (ts - last) / 1000 || 0.016); last = ts;
  if (R && V && V.phase === 'race') {
    acc += dt; var n = 0; while (acc >= 1 / 60 && n < 6) { stepRace(1 / 60); acc -= 1 / 60; n++; } if (n >= 6) acc = 0;
    sendAcc += dt; if (sendAcc >= 0.05) { sendAcc = 0; netTick(); }
    draw();
  }
}
requestAnimationFrame(loop);

/* ---------------- input ---------------- */

function updKeys() {
  I.steer = (keys.ArrowRight || keys.KeyD ? 1 : 0) - (keys.ArrowLeft || keys.KeyA ? 1 : 0) + (I.tl ? -1 : 0) + (I.tr ? 1 : 0);
  I.steer = clamp(I.steer, -1, 1);
  I.gas = !!(keys.ArrowUp || keys.KeyW); I.brake = !!(keys.ArrowDown || keys.KeyS || I.tb); I.nitro = !!(keys.Space || keys.ShiftLeft || keys.ShiftRight || I.tn);
}
window.addEventListener('keydown', function (e) {
  if (!R || (e.target && e.target.tagName === 'INPUT')) return;
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].indexOf(e.code) >= 0) e.preventDefault();
  if ((e.code === 'KeyE' || e.code === 'KeyX' || e.code === 'Enter') && !keys[e.code]) useItem();
  keys[e.code] = true; updKeys();
});
window.addEventListener('keyup', function (e) { keys[e.code] = false; updKeys(); });
window.addEventListener('blur', function () { keys = {}; I.tl = I.tr = I.tb = I.tn = false; updKeys(); });

}
bindTouch('tl', function () { I.tl = true; }, function () { I.tl = false; });
bindTouch('tr', function () { I.tr = true; }, function () { I.tr = false; });

bindTouch('tn', function () { I.tn = true; }, function () { I.tn = false; });

if ('ontouchstart' in window || navigator.maxTouchPoints > 0) { touchMode = true; document.body.classList.add('touch'); }

}

$('app').addEventListener('input', function (e) {
